name: frame

services:
  frame:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_API_READ_ACCESS_TOKEN: "${TMDB_API_READ_ACCESS_TOKEN:-}"
      TMDB_CACHE_SECONDS: "${TMDB_CACHE_SECONDS:-1800}"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/about', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
