name: filmsou

# Optional landing page: a static nginx that talks to Pansou on the shared network.
# The page itself is user-supplied; see deploy/soeasy/README.md.
services:
  soeasy:
    image: nginx:alpine
    container_name: soeasy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOEASY_PORT:-8080}:80"
    volumes:
      - ./soeasy/index.html:/usr/share/nginx/html/index.html:ro
      - ./soeasy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - filmsou

networks:
  filmsou:
    name: filmsou
