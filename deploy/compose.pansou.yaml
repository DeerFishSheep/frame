name: filmsou

# Pansou is an independent open-source project (github.com/fish2018/pansou).
# This file only wires its published image into the same network so frame can reach it as http://pansou:80.
services:
  pansou:
    image: ${PANSOU_IMAGE:-ghcr.io/fish2018/pansou-web}:${PANSOU_VERSION:-latest}
    container_name: pansou
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PANSOU_PORT:-23456}:80"
    environment:
      # Empty means the Pansou image default (all bundled plugins and channels).
      ENABLED_PLUGINS: "${PANSOU_ENABLED_PLUGINS:-}"
      CHANNELS: "${PANSOU_CHANNELS:-}"
      CONCURRENCY: "${PANSOU_CONCURRENCY:-60}"
      ASYNC_MAX_BACKGROUND_WORKERS: "${PANSOU_MAX_WORKERS:-60}"
      CACHE_MAX_SIZE: "${PANSOU_CACHE_SIZE:-500}"
      ASYNC_RESPONSE_TIMEOUT: "${PANSOU_TIMEOUT:-6}"
    networks:
      - filmsou

networks:
  filmsou:
    name: filmsou
